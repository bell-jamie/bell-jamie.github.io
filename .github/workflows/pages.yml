name: Deploy Directory to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch: # allows manual trigger

permissions:
  contents: write # for committing to gh-pages branch

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine next package version
        id: version
        run: |
          if git fetch origin gh-pages 2>/dev/null && git show FETCH_HEAD:package.json > /tmp/prev.json 2>/dev/null; then
            PREV=$(node -p "require('/tmp/prev.json').version")
          else
            PREV="0.0.0"
          fi
          NEXT=$(node -e "
            const [maj, min, pat] = '$PREV'.split('.').map(Number);
            console.log(\`\${maj}.\${min}.\${pat + 1}\`);
          ")
          echo "Previous version: $PREV -> next version: $NEXT"
          echo "next=$NEXT" >> "$GITHUB_OUTPUT"

      - name: Set package version
        run: npm version ${{ steps.version.outputs.next }} --no-git-tag-version --allow-same-version

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: . # deploy from root of repo
          branch: gh-pages
          single-commit: true # keeps gh-pages branch clean
          clean: true # removes files that don't exist in source
